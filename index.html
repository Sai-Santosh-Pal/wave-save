<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wave Save</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: url('app/assets/background.png') no-repeat center center;
      background-size: cover;
    }
    #title {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      width: 60vw;
      max-width: 700px;
    }
    #startBtn, #creditsBtn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
      transition: transform 0.2s;
      width: 30vw;
      max-width: 300px;
    }
    #startBtn {
      top: 60%;
    }
    #creditsBtn {
      top: 72%;
    }
    #startBtn:hover, #creditsBtn:hover {
      transform: translateX(-50%) scale(1.05);
    }
    #downloadStatus {
      position: absolute;
      top: 85%;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 18px;
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 5px;
      display: none;
    }

    @media (max-width: 600px) {
      #title {
        width: 70vw;
      }
      #startBtn, #creditsBtn {
        width: 40vw;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <img src="app/assets/heading.png" id="title" alt="Wave Save Title">
    <a href="https://github.com/Sai-Santosh-Pal/wave-save/releases/download/v1.0/WaveSave.exe" download>
      <img src="app/assets/download.png" id="startBtn" alt="Start">
    </a>
    <div id="downloadStatus"></div>
  </div>

  <script>
    // Add download tracking
    document.querySelector('#startBtn').addEventListener('click', function() {
      const statusElement = document.getElementById('downloadStatus');
      statusElement.style.display = 'block';
      statusElement.textContent = 'Download started! Check your downloads folder.';
      setTimeout(() => {
        statusElement.style.display = 'none';
      }, 3000);
    });

    function showCredits() {
      alert("Credits Clicked!");
    }
  </script>
</body>
</html>
